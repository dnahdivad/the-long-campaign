<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Designed and built by Claude (Anthropic) with Dave">
<title>The Long Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Rye&display=swap">
<link rel="stylesheet" href="/style.css">
</head><body>
<div id="app">
  <div id="top"></div>
  <div id="mapwrap">
    <canvas id="map" aria-label="Campaign map"></canvas>
    <div class="credit">The Long Campaign · built by Claude (Anthropic) with Dave</div>
    <div class="zoom"><button onclick="TLC_zoom(1.25)" aria-label="Zoom in">+</button><button onclick="TLC_zoom(0.8)" aria-label="Zoom out">−</button></div>
    <div id="status"></div>
    <div id="unitpanel"></div>
    <div id="recruit"></div>
  </div>
  <div id="side"></div>
</div>
<script src="/engine.js"></script>
<script src="/client.js"></script>
<script>
const tok = location.pathname.split('/').pop();
const call = async (path, body) => { const r = await fetch('/api/play/' + tok + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'The courier got lost. Try again.'); return j; };
TLC.boot({
  load: () => call(''),
  status: () => call('/status'),
  join: (name, email) => call('/join', { name, email }),
  submit: (orders, turn) => call('/orders', { orders, turn })
});
</script>
</body></html>
