<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Designed and built by Claude (Anthropic) with Dave">
<title>The Long Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Rye&display=swap">
<style>
/* The Long Campaign — one look: a field desk at night. Parchment panels on dark wood. */
:root {
  --night: #16120c; --wood: #241b12; --ink: #2a1d12; --ink2: #5a4630; --parch: #ecdfbf; --parch2: #e0cfa6; --brass: #c99a2e; --blood: #9a2f22;
  --f-display: "Rye", Georgia, serif; --f-body: "IM Fell English", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--parch); font-family: var(--f-body); }
button { font: inherit; cursor: pointer; border: 1.5px solid var(--ink); background: var(--parch2); color: var(--ink); border-radius: 3px; padding: 7px 11px; font-size: 15px; line-height: 1.15; }
button:hover:not([disabled]) { background: #f6e7bd; }
button.on, button.primary, button.on:hover:not([disabled]), button.primary:hover:not([disabled]) { background: #3a2816; color: #f2e7c9; border-color: #17110a; }
button.primary:hover:not([disabled]) { background: #4a3420; }
button.primary { font-size: 17px; padding: 10px 16px; }
button[disabled] { opacity: 0.45; cursor: default; }
button.ghost { background: transparent; border-color: var(--ink2); }
input { font: inherit; font-size: 16px; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 3px; background: #fbf4e0; color: var(--ink); width: 100%; margin: 4px 0; }
input[type=number] { width: 64px; display: inline-block; }
input[type=checkbox] { width: auto; margin: 0 6px 0 0; }
a { color: var(--brass); }
.small { font-size: 14px; color: var(--ink2); line-height: 1.35; }
.hint { font-style: italic; }
.row { display: flex; gap: 6px; align-items: center; }
.wrap { flex-wrap: wrap; }

/* the campaign table */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 360px; }
#top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 6px 12px; background: var(--parch); color: var(--ink); border-bottom: 2px solid var(--ink); }
#top .title b { font-family: var(--f-display); font-size: 20px; font-weight: normal; margin-right: 10px; }
#top .date { font-size: 14px; color: var(--ink2); }
#top .res { display: flex; gap: 12px; font-size: 16px; }
#top .wx { display: flex; gap: 4px; }
.wxchip { padding: 3px 7px; font-size: 14px; }
.wxchip small { font-size: 11px; color: inherit; opacity: 0.8; }
#clock { font-size: 14px; color: var(--blood); }
.players { display: flex; gap: 4px; margin-left: auto; }
.pdot { width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: 2px solid var(--ink); color: #fff; font-size: 12px; display: grid; place-items: center; }
.pdot.out { opacity: 0.3; }
#mapwrap { position: relative; overflow: hidden; background: #18140e; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
#side { background: var(--parch); color: var(--ink); border-left: 2px solid var(--ink); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 6px 6px 0; flex-wrap: wrap; }
.tabs button { padding: 5px 8px; font-size: 14px; border-radius: 3px 3px 0 0; }
.tabbody { padding: 10px 12px 16px; overflow-y: auto; flex: 1; border-top: 1.5px solid var(--ink); }
.olist { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; }
.oline { font-size: 14px; padding: 4px 6px; border-radius: 3px; cursor: pointer; line-height: 1.3; }
.oline:hover { background: rgba(42, 29, 18, 0.08); }
.oline i { color: var(--blood); }
.sw { display: inline-block; width: 10px; height: 10px; background: var(--c); border: 1px solid var(--ink); margin-right: 6px; vertical-align: middle; }
.submit { position: sticky; bottom: -16px; background: var(--parch); padding: 10px 0 4px; border-top: 1px solid rgba(42, 29, 18, 0.25); }
.submit button { width: 100%; }
.army-card { border-left: 6px solid var(--c); padding: 6px 10px; margin: 8px 0; background: rgba(42, 29, 18, 0.05); }
.army-card .ah { font-size: 15px; }
.chk { display: flex; align-items: center; font-size: 14px; margin: 4px 0; cursor: pointer; }
.gift { font-size: 14px; margin-top: 4px; }
.secret { background: #2a1d12; color: #f2e7c9; padding: 10px 12px; border-radius: 3px; font-size: 16px; }
.secret .small { color: #d9c491; margin-top: 4px; }
h4 { font-family: var(--f-display); font-weight: normal; font-size: 16px; margin: 14px 0 4px; }
.news { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.35; }
.rules p { margin: 0 0 8px; }
.over { background: #3a2816; color: #f2e7c9; padding: 10px 12px; border-radius: 3px; margin-bottom: 10px; }
.over h3 { font-family: var(--f-display); font-weight: normal; margin: 0 0 4px; font-size: 22px; }
.over .oline { color: #f2e7c9; }
#unitpanel, #recruit { position: absolute; left: 10px; right: 10px; bottom: 10px; max-width: 760px; background: var(--parch); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 8px 10px; display: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
.uhead { font-size: 16px; margin-bottom: 2px; }
#status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(242, 231, 201, 0.95); color: var(--ink); border: 1.5px solid var(--ink); padding: 6px 12px; border-radius: 3px; font-size: 15px; display: none; max-width: 90%; text-align: center; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 38px; height: 38px; padding: 0; font-size: 20px; }
.modalwrap { position: fixed; inset: 0; background: rgba(10, 7, 4, 0.6); display: grid; place-items: center; z-index: 10; padding: 16px; }
.modal { background: var(--parch); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 16px 18px; max-width: 460px; width: 100%; }
.modal h3 { font-family: var(--f-display); font-weight: normal; margin: 0 0 8px; font-size: 22px; }
.modal p { font-size: 15px; margin: 0 0 10px; }
.modal .primary { width: 100%; margin-top: 8px; }
button.army { border-left: 8px solid var(--c); }
.credit { position: absolute; left: 10px; top: 10px; font-size: 12px; color: rgba(242, 231, 201, 0.55); pointer-events: none; }
.fatal { max-width: 520px; margin: 15vh auto; padding: 0 20px; }
.fatal h2 { font-family: var(--f-display); font-weight: normal; }
@media (max-width: 1000px) { #app { grid-template-columns: 1fr 300px; } .tabs button { padding: 4px 6px; font-size: 13px; } }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 42vh; }
  #mapwrap, #side { grid-column: 1; }
  #side { border-left: 0; border-top: 2px solid var(--ink); }
  #top { gap: 4px 10px; }
  #top .title b { font-size: 17px; }
  .players { margin-left: 0; }
}

/* the front page */
.front { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
.front h1 { font-family: var(--f-display); font-weight: normal; font-size: clamp(40px, 7vw, 72px); margin: 10px 0 0; color: #f2e3bb; letter-spacing: 1px; }
.front .lede { font-size: 20px; color: #d9c491; margin: 6px 0 22px; }
.front .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 22px; }
.card { background: var(--parch); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 16px 18px; }
.card h2 { font-family: var(--f-display); font-weight: normal; margin: 0 0 10px; font-size: 24px; }
.field { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 6px 10px; margin: 8px 0; font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 6px 10px; font-size: 14px; }
.links { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.link { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; font-size: 14px; border-left: 6px solid var(--c); padding: 4px 8px; background: rgba(42, 29, 18, 0.05); }
.link code { font-size: 12px; overflow-wrap: anywhere; }
.features li { margin: 4px 0; font-size: 16px; line-height: 1.35; }
.foot { margin-top: 30px; font-size: 14px; color: rgba(242, 231, 201, 0.6); text-align: center; }
@media (max-width: 820px) { .front .grid { grid-template-columns: 1fr; } .field { grid-template-columns: 1fr; } }
</style></head><body>
<div id="app">
  <div id="top"></div>
  <div id="mapwrap">
    <canvas id="map" aria-label="Campaign map"></canvas>
    <div class="credit">The Long Campaign · built by Claude (Anthropic) with Dave</div>
    <div class="zoom"><button onclick="TLC_zoom(1.25)" aria-label="Zoom in">+</button><button onclick="TLC_zoom(0.8)" aria-label="Zoom out">−</button></div>
    <div id="status"></div>
    <div id="unitpanel"></div>
    <div id="recruit"></div>
  </div>
  <div id="side"></div>
</div>
<script>
/* ============================================================================
   THE LONG CAMPAIGN — rules engine (shared by the server and the browser)
   Designed and built by Claude (Anthropic) with Dave.
   ============================================================================ */
(function (root) {
'use strict';
const E = {};

/* ---------------- utilities ---------------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const K = (q, r) => q + ',' + r;
const P = k => { const i = k.indexOf(','); return [+k.slice(0, i), +k.slice(i + 1)]; };
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const hdist = (a, b) => { const [aq, ar] = typeof a === 'string' ? P(a) : a, [bq, br] = typeof b === 'string' ? P(b) : b; return (Math.abs(aq - bq) + Math.abs(ar - br) + Math.abs(aq + ar - bq - br)) / 2; };
const nbrs = k => { const [q, r] = P(k); return DIRS.map(([dq, dr]) => K(q + dq, r + dr)); };
const toXY = (q, r) => [Math.sqrt(3) * (q + r / 2), 1.5 * r];
function fromXY(x, y) {
  let q = (Math.sqrt(3) / 3 * x - y / 3) / 1, r = (2 / 3 * y);
  let s = -q - r, rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
  if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
  return [rq, rr];
}
E.util = { rng, clamp, K, P, DIRS, hdist, nbrs, toXY, fromXY };

/* ---------------- the rules in numbers ---------------- */
const UNIT = {
  inf: { name: 'Infantry', men: 3, sup: 3, mp: 3, atk: 4, def: 5, sight: 2, up: 1 },
  cav: { name: 'Cavalry', men: 3, sup: 5, mp: 5, atk: 4, def: 3, sight: 3, up: 2 },
  art: { name: 'Artillery', men: 2, sup: 6, mp: 2, atk: 1.5, def: 2, sight: 2, up: 2, bombard: 5, range: 2 },
  eng: { name: 'Engineers', men: 2, sup: 4, mp: 3, atk: 1, def: 3, sight: 2, up: 1 },
  gen: { name: 'General', men: 2, sup: 4, mp: 4, atk: 1, def: 2, sight: 3, up: 0 }
};
const TER = {
  clear: { name: 'Open ground', cost: 1, def: 1 },
  woods: { name: 'Woods', cost: 2, def: 1.3 },
  hills: { name: 'Hills', cost: 2, def: 1.35 },
  water: { name: 'River', cost: 99, def: 1 },
  town: { name: 'Town', cost: 1, def: 1.4 }
};
const KIND = { town: { name: 'Town', men: 1, sup: 1, def: 1.4, vp: 1, cap: 1 }, hq: { name: 'Headquarters', men: 3, sup: 5, def: 1.6, vp: 2, cap: 4 }, city: { name: 'Capital', men: 3, sup: 4, def: 1.6, vp: 4, cap: 3 } };
const COLORS = [
  { id: 'blue', name: 'Blue', c: '#30478f', C: '#23356c', l: '#4f68b8', h: '#22305f', H: '#141c3a', t: '#86a0d6', T: '#6680b8', ui: '#3a5cc0' },
  { id: 'grey', name: 'Grey', c: '#8f908a', C: '#6f7069', l: '#b9bab0', h: '#6e6f68', H: '#4e4f48', t: '#a88b58', T: '#8a7044', ui: '#7d7e78' },
  { id: 'crimson', name: 'Crimson', c: '#a8332a', C: '#7e2219', l: '#d0584c', h: '#3a2214', H: '#24140a', t: '#d8d0c0', T: '#b0a898', ui: '#c0392b' },
  { id: 'green', name: 'Green', c: '#3e7a34', C: '#2b5a24', l: '#62a24e', h: '#24401c', H: '#162a10', t: '#8a7a5a', T: '#6a5c40', ui: '#3e8a34' },
  { id: 'gold', name: 'Butternut', c: '#b48a3c', C: '#8e6a28', l: '#d8b060', h: '#6a4a20', H: '#4a3214', t: '#7a6a50', T: '#5e5038', ui: '#c8962a' },
  { id: 'purple', name: 'Purple', c: '#6a3a8a', C: '#4e2868', l: '#9058b4', h: '#2e1a3e', H: '#1e1028', t: '#c0b8c8', T: '#9890a4', ui: '#7c46a8' }
];
const NEUTRAL = 99;
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const SEASON_OF = m => (m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter');
const WEATHER = {
  clear: { name: 'Clear', desc: 'Good marching weather.' },
  rain: { name: 'Rain', desc: 'Mud off the roads (+1 to move), guns stuck to roads, fords flooded, powder damp (attacks weaker).' },
  fog: { name: 'Fog', desc: 'Units see only the next hex. No long-range bombardment.' },
  heat: { name: 'Heat', desc: 'Units marching three hexes or more may lose men to the heat.' },
  snow: { name: 'Snow', desc: 'Hard going (+½ to move). Units out of supply lose men twice as fast.' }
};
const ERAS = [
  { year: 1861, name: 'Muskets and smoothbores', text: '' },
  { year: 1862, name: 'Rifled guns', text: 'Artillery bombardment is 25% stronger.' },
  { year: 1863, name: 'Repeating carbines', text: 'Cavalry attacks are 25% stronger.' },
  { year: 1864, name: 'Trench warfare', text: 'Earthworks can be dug three deep and protect better.' }
];
const GOALS = {
  capital: { text: 'Hold the Capital at the end of the war.', vp: 5 },
  towns: { text: 'Hold at least {n} towns at the end of the war.', vp: 4 },
  kills: { text: 'Destroy {n} enemy units during the war.', vp: 4 },
  hq: { text: 'Never let your headquarters fall.', vp: 3 },
  raider: { text: 'Break {n} enemy railway hexes with cavalry raids.', vp: 3 },
  enemyhq: { text: 'Hold another army\'s headquarters at the end.', vp: 5 },
  army: { text: 'Field the largest army at the end of the war.', vp: 3 },
  far: { text: 'Hold a town on the far side of the map at the end.', vp: 3 }
};
E.UNIT = UNIT; E.TER = TER; E.KIND = KIND; E.COLORS = COLORS; E.NEUTRAL = NEUTRAL; E.WEATHER = WEATHER; E.ERAS = ERAS; E.GOALS = GOALS; E.MONTHS = MONTHS; E.SEASON_OF = SEASON_OF;

/* ---------------- symmetry groups for fair maps ---------------- */
const rot60 = ([q, r]) => [-r, q + r];
const refl = ([q, r]) => [q, -q - r];
function groupFor(n) {
  const rot = k => p => { for (let i = 0; i < k; i++) p = rot60(p); return p; };
  if (n === 2) return [rot(0), rot(3)];
  if (n === 3) return [rot(0), rot(2), rot(4)];
  if (n === 4) return [rot(0), rot(3), p => refl(p), p => refl(rot(3)(p))];
  return [0, 1, 2, 3, 4, 5].map(rot);
}
function seatAngle(n) { return n === 4 ? 15 : 0; }

/* ---------------- names ---------------- */
const TOWNS = ['Millersburg', 'New Hope', 'Oak Grove', 'Salem', 'Harmony', 'Cedar Run', 'Pine Bluff', 'Mount Zion', 'Goshen', 'Bethel', 'Fairview', 'Cross Keys', 'Liberty', 'Shady Grove', 'Spring Hill', 'Rock Creek', 'Ashland', 'Brandon', 'Clayton', 'Dover', 'Elkton', 'Franklin', 'Glenville', 'Hanover', 'Irvington', 'Jasper', 'Kingston', 'Lebanon', 'Marion', 'Newbern', 'Oxford', 'Paris', 'Quincy', 'Ripley', 'Sparta', 'Troy', 'Union Mills', 'Vernon', 'Warrenton', 'Yorktown', 'Zanesville', 'Albion', 'Berea', 'Canton', 'Danville', 'Edgefield', 'Florence', 'Gainesboro', 'Hillsboro', 'Jonesboro', 'Kent', 'Lancaster', 'Mechanicsville', 'Nashboro', 'Orange', 'Petersville', 'Richland', 'Stanton', 'Tazewell', 'Upton', 'Verona', 'Wilmot'];
const CAPITALS = ['Columbia', 'Fairhaven', 'Meridian', 'Concord', 'Providence', 'Charleston', 'Lexington', 'Jefferson'];
const HQ_NAMES = ['Fort Ashby', 'Camp Douglas', 'Fort Hale', 'Camp Lee', 'Fort Mercer', 'Camp Brandt'];

/* ---------------- map generation ---------------- */
E.newGame = function (opts) {
  const n = clamp(opts.seats | 0, 2, 6);
  const seed = (opts.seed >>> 0) || ((Math.random() * 4294967295) >>> 0);
  const R = rng(seed), rf = (a, b) => a + R() * (b - a), ri = (a, b) => Math.floor(rf(a, b + 1)), pick = a => a[Math.floor(R() * a.length)];
  const size = opts.mapSize || 'normal';
  const Rad = ({ 2: 10, 3: 11, 4: 12, 5: 14, 6: 14 }[n]) + (size === 'large' ? 3 : size === 'small' ? -2 : 0);
  const G = groupFor(n), slots = n === 5 ? 6 : n;
  const hexes = {};
  for (let q = -Rad; q <= Rad; q++) for (let r = -Rad; r <= Rad; r++) if (Math.abs(q + r) <= Rad) hexes[K(q, r)] = { q, r, t: 'clear' };
  const keys = Object.keys(hexes);
  const orbit = k => { const p = P(k), s = new Set(); for (const g of G) { const [a, b] = g(p); s.add(K(a, b)); } return [...s]; };
  // smooth noise from random bumps, averaged over each orbit so the board is symmetric
  const bumps = (count, rad) => Array.from({ length: count }, () => ({ x: rf(-1.7, 1.7) * Rad, y: rf(-1.5, 1.5) * Rad, r: rf(0.6, 1.4) * rad, h: rf(0.5, 1) }));
  const field = list => k => { const [x, y] = toXY(...P(k)); let v = 0; for (const b of list) { const d = ((x - b.x) ** 2 + (y - b.y) ** 2) / (b.r * b.r); v += b.h * Math.exp(-d); } return v; };
  const symField = f => { const out = {}; for (const k of keys) { if (out[k] !== undefined) continue; const o = orbit(k).filter(x => hexes[x]); const v = Math.max(...o.map(f)); for (const x of o) out[x] = v; } return out; };
  const density = { light: 0.7, normal: 1, heavy: 1.35 }[opts.terrain || 'normal'];
  const nb = Math.max(2, Math.round(Rad * 0.45 / Math.max(1, G.length / 2)));
  const hill = symField(field(bumps(Math.round(nb * 0.8), 3.6)));
  const wood = symField(field(bumps(Math.round(nb * 1.3 * density), 4.2)));
  const thr = (fld, frac) => { const v = keys.map(k => fld[k]).sort((a, b) => b - a); return v[Math.floor(v.length * frac)]; };
  const hT = thr(hill, 0.12 * Math.sqrt(density)), wT = thr(wood, 0.22 * density);
  for (const k of keys) {
    if (hill[k] > hT && hdist(k, '0,0') > 1) hexes[k].t = 'hills';
    else if (wood[k] > wT) hexes[k].t = 'woods';
  }
  // seats: headquarters placed by symmetry
  const ang = seatAngle(n) * Math.PI / 180, dist0 = Rad * 0.74;
  const h0 = fromXY(Math.cos(ang) * dist0 * Math.sqrt(3), Math.sin(ang) * dist0 * 1.5);
  const hqAll = G.map(g => K(...g(h0)));
  const center = K(0, 0);
  const protect = new Set([center, ...hqAll]);
  for (const h of hqAll) for (const x of nbrs(h)) protect.add(x);
  // rivers: random walks from near the centre to the edge, copied around the board
  const rivers = new Set();
  const nRiv = opts.rivers === undefined ? 1 : opts.rivers;
  for (let i = 0; i < nRiv; i++) {
    let cur = K(...fromXY(rf(-0.3, 0.3) * Rad, rf(-0.3, 0.3) * Rad)), dir = ri(0, 5), steps = 0;
    while (hexes[cur] && steps++ < Rad * 1.4) {
      if (!protect.has(cur) && hdist(cur, center) > 2) rivers.add(cur);
      if (R() < 0.35) dir = (dir + (R() < 0.5 ? 1 : 5)) % 6;
      const [q, r] = P(cur); cur = K(q + DIRS[dir][0], r + DIRS[dir][1]);
    }
  }
  for (const k of [...rivers]) for (const o of orbit(k)) if (hexes[o] && !protect.has(o)) hexes[o].t = 'water';
  // towns: the capital at the centre, headquarters, then neutral towns placed one orbit at a time
  const towns = [];
  const usedNames = new Set(), tname = () => { let s; do s = pick(TOWNS); while (usedNames.has(s)); usedNames.add(s); return s; };
  const setTown = (k, kind, name, owner) => { const h = hexes[k]; h.t = 'town'; h.town = { name, kind, owner, fort: kind === 'town' ? 0 : 1 }; towns.push(k); };
  setTown(center, 'city', pick(CAPITALS), NEUTRAL);
  const seatOf = {};
  hqAll.forEach((k, i) => { setTown(k, 'hq', HQ_NAMES[i], i < n || n !== 5 ? (i < n ? i : NEUTRAL) : NEUTRAL); seatOf[k] = i; });
  if (n === 5) { const k = hqAll[5]; hexes[k].town.kind = 'town'; hexes[k].town.name = tname(); hexes[k].town.fort = 1; }
  const perSeat = Math.round(Rad * 0.55 * (opts.towns === 'many' ? 1.4 : opts.towns === 'few' ? 0.7 : 1));
