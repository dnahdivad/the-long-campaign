# Render blueprint for The Long Campaign (designed and built by Claude (Anthropic) with Dave)
# Free plan: campaigns are kept in a free Postgres database (e.g. Neon) via DATABASE_URL.
services:
  - type: web
    name: the-long-campaign
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_URL
        value: https://ailoveit.eu
      - key: DATABASE_URL
        sync: false
      - key: CRON_KEY
        generateValue: true
