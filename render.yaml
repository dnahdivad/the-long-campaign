# Render blueprint for The Long Campaign (designed and built by Claude (Anthropic) with Dave)
# Starter plan with a 1 GB persistent disk at /var/data where the campaigns are kept.
services:
  - type: web
    name: the-long-campaign
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_URL
        value: https://ailoveit.eu
      - key: DATA_DIR
        value: /var/data
      - key: CRON_KEY
        generateValue: true
    disk:
      name: campaigns
      mountPath: /var/data
      sizeGB: 1
